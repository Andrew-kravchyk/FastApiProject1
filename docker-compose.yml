services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    container_name: database_Andrij
    restart: unless-stopped
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  test_db:
    image: postgres:16
    environment:
      POSTGRES_DB: app_test_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    container_name: database_Andrij_test
    restart: unless-stopped
    ports:
      - "55433:5432"
    volumes:
      - pgtestdata:/var/lib/postgresql/data

  api:
    build: .
    container_name: Andrij_api
    restart: unless-stopped
    env_file: .env
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@test_db:5432/app_test_db
    depends_on:
      - db
      - test_db
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: Andrij_postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://postgres:postgres@db:5432/app_db?sslmode=disable
    depends_on:
      - db
    ports:
      - "9187:9187"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: Andrij_cadvisor
    restart: unless-stopped
    privileged: true
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: Andrij_prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    depends_on:
      - api
      - postgres_exporter
      - cadvisor

  grafana:
    image: grafana/grafana:11.3.0
    container_name: Andrij_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
  pgtestdata:
  prometheusdata:
  grafanadata:
